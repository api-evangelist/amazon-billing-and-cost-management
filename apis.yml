aid: amazon-billing-and-cost-management
name: Amazon Billing And Cost Management
description: >-
  AWS Billing and Cost Management is a suite of tools and APIs that enables
  organizations to view, analyze, forecast, budget, and optimize their AWS
  spending. It includes AWS Cost Explorer for cost analysis, AWS Budgets for
  budget tracking and alerts, Cost Anomaly Detection for ML-powered anomaly
  identification, Cost Categories for spend organization, and the AWS Price
  List API for programmatic pricing queries. The suite supports consolidated
  billing across AWS Organizations and chargeback/showback workflows.
